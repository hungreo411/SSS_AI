name: Ban tin tong hop

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Khung thoi gian (gio)"
        default: "24"
      full:
        description: "Quet sau (--full)"
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m news_crawler --hours "${{ inputs.hours }}" ${{ inputs.full && '--full' || '' }} --out reports/ban-tin.html
      - uses: actions/upload-artifact@v4
        with:
          name: ban-tin
          path: reports/ban-tin.html
